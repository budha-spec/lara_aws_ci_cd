name: Deploy Laravel

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:

  # ============================================================
  # TERRAFORM
  # ============================================================

  terraform:
    uses: ./.github/workflows/terraform.yml
    secrets: inherit


  # ============================================================
  # DEPLOY
  # ============================================================

  deploy:
    runs-on: ubuntu-latest

    needs:
      - terraform

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}

      # ECR
      ECR_REPOSITORY: lara-aws-tf-prod-laravel

      # Elastic Beanstalk
      EB_APPLICATION: lara-aws-tf-prod
      EB_ENVIRONMENT: lara-aws-tf-prod-env

      # S3
      EB_S3_BUCKET: lara-aws-tf-prod

      # Immutable image
      IMAGE_TAG: ${{ github.sha }}

    steps:

      # ========================================================
      # CHECKOUT
      # ========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ========================================================
      # VERIFY REQUIRED SECRETS
      # ========================================================

      - name: Verify application secrets
        shell: bash
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          set -euo pipefail

          echo "======================================"
          echo "VERIFY APPLICATION SECRETS"
          echo "======================================"

          if [ -z "$APP_KEY" ]; then
            echo "ERROR: APP_KEY GitHub secret is missing."
            exit 1
          fi

          if [ -z "$APP_URL" ]; then
            echo "ERROR: APP_URL GitHub secret is missing."
            exit 1
          fi

          echo "APP_KEY: PRESENT"
          echo "APP_KEY length: ${#APP_KEY}"
          echo "APP_URL: PRESENT"

      # ========================================================
      # AWS CREDENTIALS
      # ========================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}


      # ========================================================
      # VERIFY AWS
      # ========================================================

      - name: Verify AWS identity
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "AWS IDENTITY"
          echo "======================================"

          aws sts get-caller-identity --no-cli-pager


      # ========================================================
      # LOGIN TO ECR
      # ========================================================

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # ========================================================
      # SET IMAGE
      # ========================================================

      - name: Set image information
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

          echo "======================================"
          echo "IMAGE"
          echo "======================================"

          echo "$IMAGE"


      # ========================================================
      # DOCKER BUILDX
      # ========================================================

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # ========================================================
      # BUILD IMAGE
      # ========================================================

      - name: Build Docker image
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "BUILDING DOCKER IMAGE"
          echo "======================================"

          docker build \
            --pull \
            --tag "$IMAGE" \
            .


      # ========================================================
      # VERIFY IMAGE
      # ========================================================

      - name: Inspect Docker image
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "DOCKER IMAGE"
          echo "======================================"

          docker image inspect "$IMAGE"


          echo "======================================"
          echo "PUBLIC DIRECTORY"
          echo "======================================"

          docker run --rm "$IMAGE" \
            sh -c 'ls -la /var/www/html/public'


          echo "======================================"
          echo "INDEX.PHP"
          echo "======================================"

          docker run --rm "$IMAGE" \
            sh -c 'test -f /var/www/html/public/index.php'


          echo "======================================"
          echo "VITE BUILD"
          echo "======================================"

          docker run --rm "$IMAGE" \
            sh -c '
              test -d /var/www/html/public/build

              test -f /var/www/html/public/build/manifest.json

              find /var/www/html/public/build \
                -maxdepth 3 \
                -type f \
                -print
            '


          echo "======================================"
          echo "VITE HOT FILE"
          echo "======================================"

          docker run --rm "$IMAGE" \
            sh -c '
              if [ -f /var/www/html/public/hot ]; then
                echo "ERROR: public/hot exists."
                exit 1
              fi

              echo "Vite hot file: NOT PRESENT"
            '


          echo "======================================"
          echo "SEARCH FOR VITE DEV SERVER"
          echo "======================================"

          docker run --rm "$IMAGE" \
            sh -c '
              if grep -R \
                -n \
                -E "localhost:5173|127\.0\.0\.1:5173|\[::1\]:5173" \
                /var/www/html \
                --exclude-dir=node_modules \
                --exclude-dir=vendor \
                2>/dev/null; then

                echo
                echo "ERROR: Vite development server reference found."
                exit 1
              fi

              echo "No Vite development server reference found."
            '


          echo "======================================"
          echo "NGINX CONFIGURATION"
          echo "======================================"

          docker run --rm "$IMAGE" nginx -t


          echo "======================================"
          echo "NGINX CONFIGURATION"
          echo "======================================"

          docker run --rm "$IMAGE" nginx -T


          echo "======================================"
          echo "PHP-FPM CONFIGURATION"
          echo "======================================"

          docker run --rm "$IMAGE" \
            sh -c '
              grep -R "clear_env" \
                /usr/local/etc/php-fpm.d/ \
                || true
            '


          echo "======================================"
          echo "ENTRYPOINT"
          echo "======================================"

          docker run --rm "$IMAGE" \
            sh -c 'cat /usr/local/bin/entrypoint.sh'


      # ========================================================
      # TEST CONTAINER
      # ========================================================

      - name: Test Docker container
        shell: bash
        run: |
          set -euo pipefail

          CONTAINER_NAME="laravel-test"
          HOST_PORT="8080"

          cleanup() {
            echo
            echo "======================================"
            echo "TEST CONTAINER CLEANUP"
            echo "======================================"

            docker logs "$CONTAINER_NAME" 2>/dev/null || true

            docker stop "$CONTAINER_NAME" 2>/dev/null || true
            docker rm "$CONTAINER_NAME" 2>/dev/null || true
          }

          trap cleanup EXIT


          # ----------------------------------------------------
          # START CONTAINER
          # ----------------------------------------------------

          echo "======================================"
          echo "START CONTAINER"
          echo "======================================"

          docker run -d \
            --name "$CONTAINER_NAME" \
            -p "${HOST_PORT}:80" \
            -e APP_ENV=production \
            -e APP_DEBUG=false \
            -e APP_KEY="${{ secrets.APP_KEY }}" \
            -e APP_URL="${{ secrets.APP_URL }}" \
            -e DB_CONNECTION="${{ secrets.DB_CONNECTION }}" \
            -e DB_HOST="${{ secrets.DB_HOST }}" \
            -e DB_PORT="${{ secrets.DB_PORT }}" \
            -e DB_DATABASE="${{ secrets.DB_DATABASE }}" \
            -e DB_USERNAME="${{ secrets.DB_USERNAME }}" \
            -e DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            "$IMAGE"


          # ----------------------------------------------------
          # WAIT FOR APPLICATION
          # ----------------------------------------------------

          echo "======================================"
          echo "WAITING FOR APPLICATION"
          echo "======================================"

          MAX_ATTEMPTS=30
          ATTEMPT=1

          until curl \
            --silent \
            --show-error \
            --fail \
            "http://localhost:${HOST_PORT}/" \
            > /dev/null
          do

            if [ "$ATTEMPT" -ge "$MAX_ATTEMPTS" ]; then

              echo "Application did not become ready."

              echo
              echo "Docker status:"
              docker ps -a

              echo
              echo "Docker logs:"
              docker logs "$CONTAINER_NAME" || true

              exit 1
            fi

            echo "Waiting... ${ATTEMPT}/${MAX_ATTEMPTS}"

            sleep 2

            ATTEMPT=$((ATTEMPT + 1))

          done

          echo "Application is ready."


          # ----------------------------------------------------
          # APP KEY
          # ----------------------------------------------------

          echo "======================================"
          echo "APP KEY"
          echo "======================================"

          docker exec "$CONTAINER_NAME" \
            sh -c '
              test -n "$APP_KEY"

              echo "APP_KEY: PRESENT"
              echo "APP_KEY length: ${#APP_KEY}"
            '


          # ----------------------------------------------------
          # PHP APP KEY
          # ----------------------------------------------------

          echo "======================================"
          echo "PHP APP KEY"
          echo "======================================"

          docker exec "$CONTAINER_NAME" \
            php -r '
              $key = getenv("APP_KEY");

              if (!$key) {
                  echo "APP_KEY missing\n";
                  exit(1);
              }

              echo "APP_KEY PRESENT\n";
              echo "APP_KEY length: " . strlen($key) . "\n";
            '


          # ----------------------------------------------------
          # DATABASE ENVIRONMENT
          # ----------------------------------------------------

          echo "======================================"
          echo "DATABASE ENVIRONMENT"
          echo "======================================"

          docker exec "$CONTAINER_NAME" \
            sh -c '
              test -n "$DB_CONNECTION"
              test -n "$DB_HOST"
              test -n "$DB_PORT"
              test -n "$DB_DATABASE"
              test -n "$DB_USERNAME"
              test -n "$DB_PASSWORD"

              echo "DB_CONNECTION: PRESENT"
              echo "DB_HOST: PRESENT"
              echo "DB_PORT: PRESENT"
              echo "DB_DATABASE: PRESENT"
              echo "DB_USERNAME: PRESENT"
              echo "DB_PASSWORD: PRESENT"
            '


          # ----------------------------------------------------
          # VITE HOT FILE
          # ----------------------------------------------------

          echo "======================================"
          echo "VITE HOT FILE"
          echo "======================================"

          docker exec "$CONTAINER_NAME" \
            sh -c '
              if [ -f /var/www/html/public/hot ]; then
                echo "ERROR: public/hot exists."
                exit 1
              fi

              echo "Vite hot file: NOT PRESENT"
            '


          # ----------------------------------------------------
          # VITE MANIFEST
          # ----------------------------------------------------

          echo "======================================"
          echo "VITE MANIFEST"
          echo "======================================"

          docker exec "$CONTAINER_NAME" \
            sh -c '
              test -f /var/www/html/public/build/manifest.json
            '

          echo "Vite manifest exists."


          # ----------------------------------------------------
          # VITE FILES
          # ----------------------------------------------------

          echo "======================================"
          echo "VITE FILES"
          echo "======================================"

          docker exec "$CONTAINER_NAME" \
            sh -c '
              find /var/www/html/public/build \
                -maxdepth 3 \
                -type f \
                -print
            '


          # ----------------------------------------------------
          # LARAVEL ABOUT
          # ----------------------------------------------------

          echo "======================================"
          echo "LARAVEL ABOUT"
          echo "======================================"

          docker exec "$CONTAINER_NAME" \
            php artisan about


          # ----------------------------------------------------
          # APP CONFIG
          # ----------------------------------------------------

          echo "======================================"
          echo "LARAVEL APP CONFIG"
          echo "======================================"

          docker exec "$CONTAINER_NAME" \
            php artisan config:show app


          # ----------------------------------------------------
          # HOME PAGE
          # ----------------------------------------------------

          echo "======================================"
          echo "HOME PAGE"
          echo "======================================"

          curl \
            --fail-with-body \
            --show-error \
            --silent \
            "http://localhost:${HOST_PORT}/"


          # ----------------------------------------------------
          # LOGIN PAGE
          # ----------------------------------------------------

          echo
          echo "======================================"
          echo "LOGIN PAGE"
          echo "======================================"

          curl \
            --fail-with-body \
            --show-error \
            --silent \
            "http://localhost:${HOST_PORT}/login" \
            -o /tmp/login.html


          # ----------------------------------------------------
          # VITE URL CHECK
          # ----------------------------------------------------

          echo "======================================"
          echo "VITE URL CHECK"
          echo "======================================"

          grep -Eo \
            'https?://[^"]+|/build/[^"]+\.(js|css)' \
            /tmp/login.html \
            || true


          # ----------------------------------------------------
          # FAIL ON VITE DEV SERVER
          # ----------------------------------------------------

          echo "======================================"
          echo "CHECK VITE DEV SERVER"
          echo "======================================"

          if grep -Eq \
            'localhost:5173|127\.0\.0\.1:5173|\[::1\]:5173' \
            /tmp/login.html; then

            echo
            echo "ERROR:"
            echo "Production page references Vite dev server."

            grep -E \
              'localhost:5173|127\.0\.0\.1:5173|\[::1\]:5173' \
              /tmp/login.html

            exit 1
          fi

          echo "No Vite development server reference found."


          # ----------------------------------------------------
          # CHECK PRODUCTION ASSETS
          # ----------------------------------------------------

          echo "======================================"
          echo "CHECK PRODUCTION VITE REFERENCES"
          echo "======================================"

          ASSETS=$(grep -Eo \
            '/build/[^"]+\.(js|css)' \
            /tmp/login.html \
            | sort -u || true)

          if [ -z "$ASSETS" ]; then

            echo "WARNING: No /build/*.js or /build/*.css references found."

          else

            echo "Production Vite assets detected."

            while IFS= read -r ASSET; do

              [ -z "$ASSET" ] && continue

              echo
              echo "Testing:"
              echo "$ASSET"

              curl \
                --fail \
                --silent \
                --show-error \
                -I \
                "http://localhost:${HOST_PORT}${ASSET}"

            done <<EOF
          $ASSETS
          EOF

          fi


          # ----------------------------------------------------
          # PUBLIC DIRECTORY
          # ----------------------------------------------------

          echo "======================================"
          echo "PUBLIC DIRECTORY"
          echo "======================================"

          docker exec "$CONTAINER_NAME" \
            sh -c 'ls -la /var/www/html/public'


          # ----------------------------------------------------
          # LARAVEL LOG
          # ----------------------------------------------------

          echo "======================================"
          echo "LARAVEL LOG"
          echo "======================================"

          docker exec "$CONTAINER_NAME" \
            sh -c '
              find /var/www/html/storage/logs \
                -maxdepth 1 \
                -type f \
                -print \
                -exec tail -100 {} \;
            ' || true


          # ----------------------------------------------------
          # PHP-FPM
          # ----------------------------------------------------

          echo "======================================"
          echo "PHP-FPM PROCESSES"
          echo "======================================"

          docker exec "$CONTAINER_NAME" \
            sh -c '
              ps aux | grep php-fpm || true
            '


          # ----------------------------------------------------
          # NGINX
          # ----------------------------------------------------

          echo "======================================"
          echo "NGINX PROCESSES"
          echo "======================================"

          docker exec "$CONTAINER_NAME" \
            sh -c '
              ps aux | grep nginx || true
            '


      # ========================================================
      # PUSH IMAGE
      # ========================================================

      - name: Push Docker image
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "PUSHING IMAGE"
          echo "======================================"

          docker push "$IMAGE"


      # ========================================================
      # VERIFY ECR
      # ========================================================

      - name: Verify ECR image
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "VERIFY ECR IMAGE"
          echo "======================================"

          aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" \
            --region "$AWS_REGION" \
            --no-cli-pager


      # ========================================================
      # CREATE DOCKERRUN
      # ========================================================

      - name: Create Dockerrun.aws.json
        shell: bash
        run: |
          set -euo pipefail

          cat > Dockerrun.aws.json <<EOF
          {
            "AWSEBDockerrunVersion": "1",
            "Image": {
              "Name": "$IMAGE",
              "Update": "true"
            },
            "Ports": [
              {
                "ContainerPort": "80"
              }
            ]
          }
          EOF

          echo "======================================"
          echo "DOCKERRUN"
          echo "======================================"

          cat Dockerrun.aws.json


      # ========================================================
      # VALIDATE DOCKERRUN
      # ========================================================

      - name: Validate Dockerrun
        shell: bash
        run: |
          set -euo pipefail

          python -m json.tool Dockerrun.aws.json


      # ========================================================
      # CREATE ZIP
      # ========================================================

      - name: Create deployment package
        shell: bash
        run: |
          set -euo pipefail

          rm -f deployment.zip

          zip -q deployment.zip Dockerrun.aws.json

          unzip -l deployment.zip


      # ========================================================
      # UPLOAD S3
      # ========================================================

      - name: Upload deployment package to S3
        shell: bash
        run: |
          set -euo pipefail

          aws s3 cp \
            deployment.zip \
            "s3://${EB_S3_BUCKET}/deployments/${IMAGE_TAG}.zip"


      # ========================================================
      # VERIFY S3
      # ========================================================

      - name: Verify S3 package
        shell: bash
        run: |
          set -euo pipefail

          aws s3api head-object \
            --bucket "$EB_S3_BUCKET" \
            --key "deployments/${IMAGE_TAG}.zip"


      # ========================================================
      # CREATE EB VERSION
      # ========================================================

      - name: Create Elastic Beanstalk application version
        shell: bash
        run: |
          set -euo pipefail

          aws elasticbeanstalk create-application-version \
            --application-name "$EB_APPLICATION" \
            --version-label "$IMAGE_TAG" \
            --source-bundle \
              "S3Bucket=${EB_S3_BUCKET},S3Key=deployments/${IMAGE_TAG}.zip" \
            --process \
            --no-cli-pager


      # ========================================================
      # DEPLOY EB
      # ========================================================

      - name: Deploy to Elastic Beanstalk
        shell: bash
        run: |
          set -euo pipefail

          aws elasticbeanstalk update-environment \
            --application-name "$EB_APPLICATION" \
            --environment-name "$EB_ENVIRONMENT" \
            --version-label "$IMAGE_TAG" \
            --no-cli-pager


      # ========================================================
      # WAIT
      # ========================================================

      - name: Wait for Elastic Beanstalk deployment
        shell: bash
        run: |
          set -euo pipefail

          echo "Waiting for Elastic Beanstalk..."

          aws elasticbeanstalk wait environment-updated \
            --environment-name "$EB_ENVIRONMENT" \
            --no-cli-pager


      # ========================================================
      # VERIFY EB
      # ========================================================

      - name: Verify Elastic Beanstalk deployment
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "ELASTIC BEANSTALK STATUS"
          echo "======================================"

          aws elasticbeanstalk describe-environments \
            --application-name "$EB_APPLICATION" \
            --environment-names "$EB_ENVIRONMENT" \
            --query 'Environments[0].[EnvironmentName,VersionLabel,Status,Health,HealthStatus,CNAME]' \
            --output table \
            --no-cli-pager


          STATUS=$(aws elasticbeanstalk describe-environments \
            --application-name "$EB_APPLICATION" \
            --environment-names "$EB_ENVIRONMENT" \
            --query 'Environments[0].Status' \
            --output text \
            --no-cli-pager)


          HEALTH=$(aws elasticbeanstalk describe-environments \
            --application-name "$EB_APPLICATION" \
            --environment-names "$EB_ENVIRONMENT" \
            --query 'Environments[0].Health' \
            --output text \
            --no-cli-pager)


          VERSION=$(aws elasticbeanstalk describe-environments \
            --application-name "$EB_APPLICATION" \
            --environment-names "$EB_ENVIRONMENT" \
            --query 'Environments[0].VersionLabel' \
            --output text \
            --no-cli-pager)


          echo
          echo "Status:  $STATUS"
          echo "Health:  $HEALTH"
          echo "Version: $VERSION"


          if [ "$STATUS" != "Ready" ]; then
            echo "ERROR: EB environment is not Ready."
            exit 1
          fi


          if [ "$VERSION" != "$IMAGE_TAG" ]; then
            echo "ERROR: Wrong EB version deployed."
            echo "Expected: $IMAGE_TAG"
            echo "Actual:   $VERSION"
            exit 1
          fi


          case "$HEALTH" in
            Green|Yellow)
              echo "Elastic Beanstalk health accepted: $HEALTH"
              ;;
            *)
              echo "ERROR: Elastic Beanstalk health: $HEALTH"
              exit 1
              ;;
          esac


      # ========================================================
      # EVENTS
      # ========================================================

      - name: Show Elastic Beanstalk events
        if: always()
        shell: bash
        run: |
          set +e

          echo "======================================"
          echo "ELASTIC BEANSTALK EVENTS"
          echo "======================================"

          aws elasticbeanstalk describe-events \
            --environment-name "$EB_ENVIRONMENT" \
            --max-items 30 \
            --query 'Events[*].[EventDate,Severity,Status,Message]' \
            --output table \
            --no-cli-pager


      # ========================================================
      # SUMMARY
      # ========================================================

      - name: Deployment summary
        shell: bash
        run: |
          set -euo pipefail

          CNAME=$(aws elasticbeanstalk describe-environments \
            --application-name "$EB_APPLICATION" \
            --environment-names "$EB_ENVIRONMENT" \
            --query 'Environments[0].CNAME' \
            --output text \
            --no-cli-pager)

          echo "======================================"
          echo "DEPLOYMENT SUCCESSFUL"
          echo "======================================"

          echo "Application: $EB_APPLICATION"
          echo "Environment: $EB_ENVIRONMENT"
          echo "Version:     $IMAGE_TAG"
          echo "Image:       $IMAGE"
          echo "CNAME:       $CNAME"
