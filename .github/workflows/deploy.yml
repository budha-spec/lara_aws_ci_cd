name: Deploy Laravel

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:

  # ============================================================
  # TERRAFORM
  # ============================================================

  terraform:
    uses: ./.github/workflows/terraform.yml
    secrets: inherit


  # ============================================================
  # DEPLOY
  # ============================================================

  deploy:
    runs-on: ubuntu-latest

    needs:
      - terraform

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}

      # --------------------------------------------------------
      # ECR
      # --------------------------------------------------------

      ECR_REPOSITORY: lara-aws-tf-prod-laravel

      # --------------------------------------------------------
      # ELASTIC BEANSTALK
      # --------------------------------------------------------

      EB_APPLICATION: lara-aws-tf-prod
      EB_ENVIRONMENT: lara-aws-tf-prod-env

      # --------------------------------------------------------
      # S3
      # --------------------------------------------------------

      EB_S3_BUCKET: lara-aws-tf-prod

      # --------------------------------------------------------
      # IMMUTABLE IMAGE TAG
      # --------------------------------------------------------

      IMAGE_TAG: ${{ github.sha }}

    steps:

      # ========================================================
      # CHECKOUT
      # ========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ========================================================
      # AWS
      # ========================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}


      # ========================================================
      # AWS IDENTITY
      # ========================================================

      - name: Verify AWS identity
        shell: bash
        run: |
          set -euo pipefail

          aws sts get-caller-identity \
            --no-cli-pager


      # ========================================================
      # ECR LOGIN
      # ========================================================

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # ========================================================
      # IMAGE
      # ========================================================

      - name: Set image
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

          echo "======================================"
          echo "DOCKER IMAGE"
          echo "======================================"

          echo "$IMAGE"


      # ========================================================
      # BUILDX
      # ========================================================

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3


      # ========================================================
      # BUILD
      # ========================================================

      - name: Build Docker image
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "BUILD DOCKER IMAGE"
          echo "======================================"

          docker build \
            --pull \
            --tag "$IMAGE" \
            .


      # ========================================================
      # IMAGE VALIDATION
      # ========================================================

      - name: Validate Docker image
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "IMAGE VALIDATION"
          echo "======================================"

          docker image inspect "$IMAGE"


          echo "======================================"
          echo "PUBLIC DIRECTORY"
          echo "======================================"

          docker run --rm \
            --entrypoint /bin/sh \
            "$IMAGE" \
            -c '
              set -eu

              ls -la /var/www/html/public
            '


          echo "======================================"
          echo "LARAVEL INDEX"
          echo "======================================"

          docker run --rm \
            --entrypoint /bin/sh \
            "$IMAGE" \
            -c '
              test -f /var/www/html/public/index.php
            '


          echo "======================================"
          echo "VITE BUILD"
          echo "======================================"

          docker run --rm \
            --entrypoint /bin/sh \
            "$IMAGE" \
            -c '
              set -eu

              test -d /var/www/html/public/build

              test -f /var/www/html/public/build/manifest.json

              find /var/www/html/public/build \
                -maxdepth 3 \
                -type f \
                -print \
                | sort
            '


          echo "======================================"
          echo "VITE HOT FILE"
          echo "======================================"

          docker run --rm \
            --entrypoint /bin/sh \
            "$IMAGE" \
            -c '
              if [ -f /var/www/html/public/hot ]; then
                echo "ERROR: public/hot exists."
                exit 1
              fi

              echo "Vite hot file: NOT PRESENT"
            '


          echo "======================================"
          echo "NGINX CONFIG"
          echo "======================================"

          docker run --rm \
            --entrypoint nginx \
            "$IMAGE" \
            -t


          echo "======================================"
          echo "PHP VERSION"
          echo "======================================"

          docker run --rm \
            --entrypoint php \
            "$IMAGE" \
            -v


      # ========================================================
      # TEST CONTAINER
      #
      # IMPORTANT:
      # Runtime secrets are supplied here.
      # ========================================================

      - name: Test Docker container
        shell: bash
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          set -euo pipefail

          CONTAINER_NAME="laravel-test"
          HOST_PORT="8080"

          cleanup() {
            echo
            echo "======================================"
            echo "CONTAINER CLEANUP"
            echo "======================================"

            docker logs "$CONTAINER_NAME" 2>/dev/null || true

            docker stop "$CONTAINER_NAME" 2>/dev/null || true
            docker rm "$CONTAINER_NAME" 2>/dev/null || true
          }

          trap cleanup EXIT


          # ----------------------------------------------------
          # START
          # ----------------------------------------------------

          echo "======================================"
          echo "START CONTAINER"
          echo "======================================"

          docker run -d \
            --name "$CONTAINER_NAME" \
            -p "${HOST_PORT}:80" \
            -e APP_ENV=production \
            -e APP_DEBUG=false \
            -e APP_KEY="$APP_KEY" \
            -e APP_URL="$APP_URL" \
            "$IMAGE"


          # ----------------------------------------------------
          # WAIT
          # ----------------------------------------------------

          echo "======================================"
          echo "WAIT FOR APPLICATION"
          echo "======================================"

          MAX_ATTEMPTS=30
          ATTEMPT=1

          until curl \
            --silent \
            --show-error \
            --fail \
            "http://127.0.0.1:${HOST_PORT}/" \
            > /dev/null
          do
            if [ "$ATTEMPT" -ge "$MAX_ATTEMPTS" ]; then

              echo "Application failed to start."

              docker ps -a

              docker logs "$CONTAINER_NAME" || true

              exit 1
            fi

            echo "Waiting... ${ATTEMPT}/${MAX_ATTEMPTS}"

            sleep 2

            ATTEMPT=$((ATTEMPT + 1))
          done

          echo "Application is ready."


          # ----------------------------------------------------
          # APP KEY
          # ----------------------------------------------------

          echo "======================================"
          echo "APP KEY"
          echo "======================================"

          docker exec "$CONTAINER_NAME" \
            sh -c '
              test -n "${APP_KEY:-}"

              echo "APP_KEY: PRESENT"
              echo "APP_KEY length: ${#APP_KEY}"
            '


          # ----------------------------------------------------
          # PHP APP KEY
          # ----------------------------------------------------

          docker exec "$CONTAINER_NAME" \
            php -r '
              $key = getenv("APP_KEY");

              if (!$key) {
                  fwrite(STDERR, "APP_KEY missing\n");
                  exit(1);
              }

              echo "APP_KEY available to PHP\n";
            '


          # ----------------------------------------------------
          # VITE HOT FILE
          # ----------------------------------------------------

          echo "======================================"
          echo "VITE HOT FILE"
          echo "======================================"

          docker exec "$CONTAINER_NAME" \
            sh -c '
              test ! -f /var/www/html/public/hot

              echo "Vite hot file: NOT PRESENT"
            '


          # ----------------------------------------------------
          # VITE MANIFEST
          # ----------------------------------------------------

          echo "======================================"
          echo "VITE MANIFEST"
          echo "======================================"

          docker exec "$CONTAINER_NAME" \
            sh -c '
              test -f /var/www/html/public/build/manifest.json

              echo "Vite manifest: PRESENT"
            '


          # ----------------------------------------------------
          # LARAVEL
          # ----------------------------------------------------

          echo "======================================"
          echo "LARAVEL ABOUT"
          echo "======================================"

          docker exec "$CONTAINER_NAME" \
            php artisan about


          # ----------------------------------------------------
          # CONFIG
          # ----------------------------------------------------

          echo "======================================"
          echo "LARAVEL CONFIG"
          echo "======================================"

          docker exec "$CONTAINER_NAME" \
            php artisan config:show app


          # ----------------------------------------------------
          # HOME
          # ----------------------------------------------------

          echo "======================================"
          echo "HOME PAGE"
          echo "======================================"

          curl \
            --fail-with-body \
            --show-error \
            --silent \
            "http://127.0.0.1:${HOST_PORT}/" \
            > /tmp/home.html


          # ----------------------------------------------------
          # LOGIN
          # ----------------------------------------------------

          echo "======================================"
          echo "LOGIN PAGE"
          echo "======================================"

          curl \
            --fail-with-body \
            --show-error \
            --silent \
            "http://127.0.0.1:${HOST_PORT}/login" \
            -o /tmp/login.html


          # ----------------------------------------------------
          # VITE DEV SERVER CHECK
          # ----------------------------------------------------

          echo "======================================"
          echo "VITE DEV SERVER CHECK"
          echo "======================================"

          if grep -Eq \
            'localhost:5173|127\.0\.0\.1:5173|\[::1\]:5173' \
            /tmp/login.html; then

            echo "ERROR: Vite development server detected."

            grep -E \
              'localhost:5173|127\.0\.0\.1:5173|\[::1\]:5173' \
              /tmp/login.html

            exit 1
          fi

          echo "No Vite development server reference."


          # ----------------------------------------------------
          # VITE ASSETS
          # ----------------------------------------------------

          echo "======================================"
          echo "VITE ASSETS"
          echo "======================================"

          ASSETS=$(grep -Eo \
            '/build/[^"]+\.(js|css)' \
            /tmp/login.html \
            | sort -u || true)

          if [ -z "$ASSETS" ]; then

            echo "WARNING: No Vite assets found."

          else

            while IFS= read -r ASSET; do

              [ -z "$ASSET" ] && continue

              echo "Testing: $ASSET"

              curl \
                --fail \
                --silent \
                --show-error \
                -I \
                "http://127.0.0.1:${HOST_PORT}${ASSET}"

            done <<< "$ASSETS"

          fi


          # ----------------------------------------------------
          # PROCESSES
          # ----------------------------------------------------

          echo "======================================"
          echo "PROCESSES"
          echo "======================================"

          docker exec "$CONTAINER_NAME" \
            sh -c '
              ps aux | grep -E "php-fpm|nginx" | grep -v grep || true
            '


          # ----------------------------------------------------
          # PUBLIC
          # ----------------------------------------------------

          echo "======================================"
          echo "PUBLIC"
          echo "======================================"

          docker exec "$CONTAINER_NAME" \
            ls -la /var/www/html/public


          echo "======================================"
          echo "CONTAINER TEST PASSED"
          echo "======================================"


      # ========================================================
      # PUSH ECR
      # ========================================================

      - name: Push Docker image
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "PUSH IMAGE"
          echo "======================================"

          docker push "$IMAGE"


      # ========================================================
      # VERIFY ECR
      # ========================================================

      - name: Verify ECR image
        shell: bash
        run: |
          set -euo pipefail

          aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" \
            --region "$AWS_REGION" \
            --no-cli-pager


      # ========================================================
      # DOCKERRUN
      # ========================================================

      - name: Create Dockerrun.aws.json
        shell: bash
        run: |
          set -euo pipefail

          cat > Dockerrun.aws.json <<EOF
          {
            "AWSEBDockerrunVersion": "1",
            "Image": {
              "Name": "$IMAGE",
              "Update": "true"
            },
            "Ports": [
              {
                "ContainerPort": "80"
              }
            ]
          }
          EOF

          cat Dockerrun.aws.json


      # ========================================================
      # VALIDATE DOCKERRUN
      # ========================================================

      - name: Validate Dockerrun
        shell: bash
        run: |
          set -euo pipefail

          python -m json.tool Dockerrun.aws.json


      # ========================================================
      # DEPLOYMENT ZIP
      # ========================================================

      - name: Create deployment package
        shell: bash
        run: |
          set -euo pipefail

          rm -f deployment.zip

          zip -q deployment.zip \
            Dockerrun.aws.json

          unzip -l deployment.zip


      # ========================================================
      # UPLOAD S3
      # ========================================================

      - name: Upload deployment package
        shell: bash
        run: |
          set -euo pipefail

          aws s3 cp \
            deployment.zip \
            "s3://${EB_S3_BUCKET}/deployments/${IMAGE_TAG}.zip"


      # ========================================================
      # VERIFY S3
      # ========================================================

      - name: Verify S3 package
        shell: bash
        run: |
          set -euo pipefail

          aws s3api head-object \
            --bucket "$EB_S3_BUCKET" \
            --key "deployments/${IMAGE_TAG}.zip"


      # ========================================================
      # CREATE EB VERSION
      # ========================================================

      - name: Create Elastic Beanstalk application version
        shell: bash
        run: |
          set -euo pipefail

          aws elasticbeanstalk create-application-version \
            --application-name "$EB_APPLICATION" \
            --version-label "$IMAGE_TAG" \
            --source-bundle \
              "S3Bucket=${EB_S3_BUCKET},S3Key=deployments/${IMAGE_TAG}.zip" \
            --process \
            --no-cli-pager


      # ========================================================
      # DEPLOY EB
      # ========================================================

      - name: Deploy to Elastic Beanstalk
        shell: bash
        run: |
          set -euo pipefail

          aws elasticbeanstalk update-environment \
            --application-name "$EB_APPLICATION" \
            --environment-name "$EB_ENVIRONMENT" \
            --version-label "$IMAGE_TAG" \
            --no-cli-pager


      # ========================================================
      # WAIT
      # ========================================================

      - name: Wait for Elastic Beanstalk
        shell: bash
        run: |
          set -euo pipefail

          echo "Waiting for Elastic Beanstalk..."

          aws elasticbeanstalk wait environment-updated \
            --environment-name "$EB_ENVIRONMENT" \
            --no-cli-pager


      # ========================================================
      # VERIFY EB
      # ========================================================

      - name: Verify Elastic Beanstalk
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "ELASTIC BEANSTALK"
          echo "======================================"

          aws elasticbeanstalk describe-environments \
            --application-name "$EB_APPLICATION" \
            --environment-names "$EB_ENVIRONMENT" \
            --query 'Environments[0].[EnvironmentName,VersionLabel,Status,Health,HealthStatus,CNAME]' \
            --output table \
            --no-cli-pager


          STATUS=$(aws elasticbeanstalk describe-environments \
            --application-name "$EB_APPLICATION" \
            --environment-names "$EB_ENVIRONMENT" \
            --query 'Environments[0].Status' \
            --output text \
            --no-cli-pager)


          HEALTH=$(aws elasticbeanstalk describe-environments \
            --application-name "$EB_APPLICATION" \
            --environment-names "$EB_ENVIRONMENT" \
            --query 'Environments[0].Health' \
            --output text \
            --no-cli-pager)


          VERSION=$(aws elasticbeanstalk describe-environments \
            --application-name "$EB_APPLICATION" \
            --environment-names "$EB_ENVIRONMENT" \
            --query 'Environments[0].VersionLabel' \
            --output text \
            --no-cli-pager)


          echo "Status:  $STATUS"
          echo "Health:  $HEALTH"
          echo "Version: $VERSION"


          if [ "$STATUS" != "Ready" ]; then
            echo "ERROR: EB environment is not Ready."
            exit 1
          fi


          if [ "$VERSION" != "$IMAGE_TAG" ]; then
            echo "ERROR: Wrong EB version deployed."
            echo "Expected: $IMAGE_TAG"
            echo "Actual:   $VERSION"
            exit 1
          fi


          case "$HEALTH" in
            Green|Yellow)
              echo "Elastic Beanstalk health accepted: $HEALTH"
              ;;
            *)
              echo "ERROR: Elastic Beanstalk health: $HEALTH"
              exit 1
              ;;
          esac


      # ========================================================
      # EVENTS
      # ========================================================

      - name: Show Elastic Beanstalk events
        if: always()
        shell: bash
        run: |
          set +e

          echo "======================================"
          echo "ELASTIC BEANSTALK EVENTS"
          echo "======================================"

          aws elasticbeanstalk describe-events \
            --environment-name "$EB_ENVIRONMENT" \
            --max-items 30 \
            --query 'Events[*].[EventDate,Severity,Status,Message]' \
            --output table \
            --no-cli-pager


      # ========================================================
      # SUMMARY
      # ========================================================

      - name: Deployment summary
        shell: bash
        run: |
          set -euo pipefail

          CNAME=$(aws elasticbeanstalk describe-environments \
            --application-name "$EB_APPLICATION" \
            --environment-names "$EB_ENVIRONMENT" \
            --query 'Environments[0].CNAME' \
            --output text \
            --no-cli-pager)


          echo "======================================"
          echo "DEPLOYMENT SUCCESSFUL"
          echo "======================================"

          echo "Application: $EB_APPLICATION"
          echo "Environment: $EB_ENVIRONMENT"
          echo "Version:     $IMAGE_TAG"
          echo "Image:       $IMAGE"
          echo "CNAME:       $CNAME"
