name: Deploy Laravel

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:

  terraform:
    uses: ./.github/workflows/terraform.yml
    secrets: inherit

  deploy:
    runs-on: ubuntu-latest
    needs: terraform

    env:
      AWS_REGION: ap-south-1
      ECR_REPOSITORY: my-laravel-app
      EB_APPLICATION: lara-aws-tf
      EB_ENVIRONMENT: lara-aws-tf-env
      EB_S3_BUCKET: lara-aws-tf-prod

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: OIDC Debugger
        uses: github/actions-oidc-debugger@main

      - name: Debug Dockerfile
        run: |
          echo "=== Dockerfiles ==="
          find . -name 'Dockerfile*' -type f -print

          echo "=== Go references ==="
          grep -R "apk add.*go\|.go-version" . \
            --exclude-dir=.git || true

          echo "=== Dockerfile being used ==="
          sed -n '1,30p' Dockerfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA}" >> $GITHUB_ENV

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}:${IMAGE_TAG} .

      - name: Push Docker image
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}:${IMAGE_TAG}

      - name: Create Dockerrun
        run: |
          cat > Dockerrun.aws.json <<EOF
          {
            "AWSEBDockerrunVersion": "1",
            "Image": {
              "Name": "${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}:${IMAGE_TAG}",
              "Update": "true"
            },
            "Ports": [
              {
                "ContainerPort": "80"
              }
            ]
          }
          EOF

      - name: Create deployment package
        run: |
          zip deploy.zip Dockerrun.aws.json

      - name: Upload deployment package to S3
        run: |
          aws s3 cp \
            deploy.zip \
            s3://${EB_S3_BUCKET}/deployments/${IMAGE_TAG}.zip

      - name: Create Elastic Beanstalk application version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name "$EB_APPLICATION" \
            --version-label "$IMAGE_TAG" \
            --source-bundle \
              S3Bucket="$EB_S3_BUCKET",S3Key="deployments/${IMAGE_TAG}.zip"

      - name: Deploy to Elastic Beanstalk
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name "$EB_ENVIRONMENT" \
            --version-label "$IMAGE_TAG"

      - name: Wait for deployment
        run: |
          aws elasticbeanstalk wait environment-updated \
            --environment-name "$EB_ENVIRONMENT"
