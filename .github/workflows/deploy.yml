name: Deploy Laravel

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:

  terraform:
    uses: ./.github/workflows/terraform.yml
    secrets: inherit

  deploy:
    runs-on: ubuntu-latest
    needs: terraform

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      ECR_REPOSITORY: lara-aws-tf-prod-laravel
      EB_APPLICATION: lara-aws-tf-prod
      EB_ENVIRONMENT: lara-aws-tf-prod-env
      EB_S3_BUCKET: lara-aws-tf-prod
      IMAGE_TAG: ${{ github.sha }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set Docker image
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

          echo "======================================"
          echo "IMAGE"
          echo "======================================"
          echo "$IMAGE"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test Docker container
        shell: bash
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          set -euo pipefail

          CONTAINER_NAME="laravel-test"
          HOST_PORT="8080"

          cleanup() {
            docker logs "$CONTAINER_NAME" 2>/dev/null || true
            docker rm -f "$CONTAINER_NAME" 2>/dev/null || true
          }

          trap cleanup EXIT

          echo "======================================"
          echo "START TEST CONTAINER"
          echo "======================================"

          test -n "$APP_KEY" || {
            echo "ERROR: APP_KEY GitHub secret is empty."
            exit 1
          }

          docker run -d \
            --name "$CONTAINER_NAME" \
            -p "${HOST_PORT}:80" \
            -e APP_ENV=production \
            -e APP_DEBUG=false \
            -e APP_KEY="$APP_KEY" \
            -e APP_URL="$APP_URL" \
            "$IMAGE"


          echo "======================================"
          echo "WAIT FOR APPLICATION"
          echo "======================================"

          MAX_ATTEMPTS=30

          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do

            if curl \
              --silent \
              --show-error \
              --fail \
              "http://127.0.0.1:${HOST_PORT}/" \
              > /dev/null; then

              echo "Application is ready."
              break
            fi

            if [ "$attempt" -eq "$MAX_ATTEMPTS" ]; then
              echo "ERROR: Application failed to start."
              docker logs "$CONTAINER_NAME" || true
              exit 1
            fi

            echo "Waiting... ${attempt}/${MAX_ATTEMPTS}"
            sleep 2

          done


          echo "======================================"
          echo "VERIFY APP_KEY"
          echo "======================================"

          docker exec "$CONTAINER_NAME" \
            php -r '
              $key = getenv("APP_KEY");

              if (!$key) {
                  fwrite(STDERR, "APP_KEY missing\n");
                  exit(1);
              }

              echo "APP_KEY available to PHP\n";
            '


          echo "======================================"
          echo "VERIFY VITE"
          echo "======================================"

          docker exec "$CONTAINER_NAME" \
            sh -c '
              set -eu

              test -f /var/www/html/public/build/manifest.json
              test ! -f /var/www/html/public/hot

              echo "Vite manifest: OK"
              echo "Vite hot file: NOT PRESENT"
            '


          echo "======================================"
          echo "VERIFY LOGIN PAGE"
          echo "======================================"

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            "http://127.0.0.1:${HOST_PORT}/login" \
            -o /tmp/login.html


          if grep -Eq \
            'localhost:5173|127\.0\.0\.1:5173|\[::1\]:5173' \
            /tmp/login.html; then

            echo "ERROR: Vite development server detected."

            grep -E \
              'localhost:5173|127\.0\.0\.1:5173|\[::1\]:5173' \
              /tmp/login.html

            exit 1
          fi


          echo "No Vite development server reference."


          echo "======================================"
          echo "VERIFY VITE ASSETS"
          echo "======================================"

          ASSETS=$(
            grep -Eo \
              '/build/[^"]+\.(js|css)' \
              /tmp/login.html \
              | sort -u \
              || true
          )

          if [ -n "$ASSETS" ]; then

            while IFS= read -r asset; do

              [ -z "$asset" ] && continue

              echo "Testing: $asset"

              curl \
                --fail \
                --silent \
                --show-error \
                -I \
                "http://127.0.0.1:${HOST_PORT}${asset}" \
                > /dev/null

            done <<< "$ASSETS"

            echo "Vite assets: OK"

          else

            echo "No Vite JS/CSS assets detected on login page."

          fi


          echo "======================================"
          echo "CONTAINER TEST PASSED"
          echo "======================================"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          pull: true
          push: true
          load: true
          tags: ${{ env.IMAGE }}

      - name: Verify ECR image
        shell: bash
        run: |
          set -euo pipefail

          aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" \
            --region "$AWS_REGION" \
            --no-cli-pager

      - name: Create Dockerrun.aws.json
        shell: bash
        run: |
          set -euo pipefail

          cat > Dockerrun.aws.json <<EOF
          {
            "AWSEBDockerrunVersion": "1",
            "Image": {
              "Name": "$IMAGE",
              "Update": "true"
            },
            "Ports": [
              {
                "ContainerPort": "80"
              }
            ]
          }
          EOF

          cat Dockerrun.aws.json

      - name: Create deployment package
        shell: bash
        run: |
          set -euo pipefail

          zip -q deployment.zip Dockerrun.aws.json

          unzip -l deployment.zip

      - name: Upload deployment package
        shell: bash
        run: |
          set -euo pipefail

          aws s3 cp \
            deployment.zip \
            "s3://${EB_S3_BUCKET}/deployments/${IMAGE_TAG}.zip"

      - name: Create Elastic Beanstalk version
        shell: bash
        run: |
          set -euo pipefail

          aws elasticbeanstalk create-application-version \
            --application-name "$EB_APPLICATION" \
            --version-label "$IMAGE_TAG" \
            --source-bundle \
              "S3Bucket=${EB_S3_BUCKET},S3Key=deployments/${IMAGE_TAG}.zip" \
            --process \
            --no-cli-pager

      - name: Deploy to Elastic Beanstalk
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "DEPLOYING"
          echo "======================================"

          aws elasticbeanstalk update-environment \
            --application-name "$EB_APPLICATION" \
            --environment-name "$EB_ENVIRONMENT" \
            --version-label "$IMAGE_TAG" \
            --no-cli-pager

      - name: Wait for Elastic Beanstalk
        shell: bash
        run: |
          set -euo pipefail

          echo "Waiting for Elastic Beanstalk deployment..."

          aws elasticbeanstalk wait environment-updated \
            --environment-name "$EB_ENVIRONMENT" \
            --no-cli-pager

          echo "Elastic Beanstalk deployment completed."

      - name: Verify deployment
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "ELASTIC BEANSTALK STATUS"
          echo "======================================"

          read -r STATUS HEALTH VERSION CNAME <<< "$(
            aws elasticbeanstalk describe-environments \
              --application-name "$EB_APPLICATION" \
              --environment-names "$EB_ENVIRONMENT" \
              --query 'Environments[0].[Status,Health,VersionLabel,CNAME]' \
              --output text \
              --no-cli-pager
          )"

          echo "Status:  $STATUS"
          echo "Health:  $HEALTH"
          echo "Version: $VERSION"
          echo "CNAME:   $CNAME"


          if [ "$STATUS" != "Ready" ]; then
            echo "ERROR: Elastic Beanstalk is not Ready."
            exit 1
          fi


          if [ "$VERSION" != "$IMAGE_TAG" ]; then
            echo "ERROR: Incorrect version deployed."
            echo "Expected: $IMAGE_TAG"
            echo "Actual:   $VERSION"
            exit 1
          fi


          case "$HEALTH" in
            Green|Yellow)
              echo "Health accepted: $HEALTH"
              ;;
            *)
              echo "ERROR: Invalid EB health: $HEALTH"
              exit 1
              ;;
          esac

      - name: Show Elastic Beanstalk events
        if: failure()
        shell: bash
        run: |
          set +e

          echo "======================================"
          echo "ELASTIC BEANSTALK EVENTS"
          echo "======================================"

          aws elasticbeanstalk describe-events \
            --environment-name "$EB_ENVIRONMENT" \
            --max-items 30 \
            --query 'Events[*].[EventDate,Severity,Status,Message]' \
            --output table \
            --no-cli-pager

      - name: Deployment successful
        shell: bash
        run: |
          set -euo pipefail

          CNAME=$(
            aws elasticbeanstalk describe-environments \
              --application-name "$EB_APPLICATION" \
              --environment-names "$EB_ENVIRONMENT" \
              --query 'Environments[0].CNAME' \
              --output text \
              --no-cli-pager
          )

          echo
          echo "======================================"
          echo "DEPLOYMENT SUCCESSFUL"
          echo "======================================"
          echo "Application : $EB_APPLICATION"
          echo "Environment : $EB_ENVIRONMENT"
          echo "Version     : $IMAGE_TAG"
          echo "Image       : $IMAGE"
          echo "CNAME       : $CNAME"
          echo "======================================"
