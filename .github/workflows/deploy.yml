name: Deploy Laravel

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:

  # ============================================================
  # TERRAFORM
  # ============================================================

  terraform:
    uses: ./.github/workflows/terraform.yml
    secrets: inherit


  # ============================================================
  # DEPLOY
  # ============================================================

  deploy:
    runs-on: ubuntu-latest
    needs: terraform

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}

      # ========================================================
      # ECR
      # ========================================================

      ECR_REPOSITORY: lara-aws-tf-prod-laravel

      # ========================================================
      # ELASTIC BEANSTALK
      # ========================================================

      EB_APPLICATION: lara-aws-tf-prod
      EB_ENVIRONMENT: lara-aws-tf-prod-env

      # ========================================================
      # S3
      # ========================================================

      EB_S3_BUCKET: lara-aws-tf-prod

      # ========================================================
      # IMAGE
      # ========================================================

      IMAGE_TAG: ${{ github.sha }}

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================================
      # AWS CREDENTIALS
      # ==========================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}


      # ==========================================================
      # VERIFY AWS
      # ==========================================================

      - name: Verify AWS identity
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "AWS IDENTITY"
          echo "======================================"

          aws sts get-caller-identity --no-cli-pager


      # ==========================================================
      # LOGIN TO ECR
      # ==========================================================

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # ==========================================================
      # IMAGE INFORMATION
      # ==========================================================

      - name: Set image information
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

          echo "======================================"
          echo "IMAGE INFORMATION"
          echo "======================================"

          echo "Repository:"
          echo "$ECR_REPOSITORY"

          echo
          echo "Tag:"
          echo "$IMAGE_TAG"

          echo
          echo "Full image:"
          echo "$IMAGE"


      # ==========================================================
      # SETUP BUILDX
      # ==========================================================

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # ==========================================================
      # BUILD DOCKER IMAGE
      #
      # Vite is built inside Docker.
      #
      # Node is only required by the frontend build stage.
      # Node does NOT need to exist in the production runtime.
      # ==========================================================

      - name: Build Docker image
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "BUILDING DOCKER IMAGE"
          echo "======================================"

          echo "$IMAGE"

          docker build \
            --pull \
            --tag "$IMAGE" \
            .


      # ==========================================================
      # INSPECT IMAGE
      # ==========================================================

      - name: Inspect Docker image
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "IMAGE"
          echo "======================================"

          echo "$IMAGE"


          # ------------------------------------------------------
          # IMAGE INFORMATION
          # ------------------------------------------------------

          echo "======================================"
          echo "DOCKER IMAGE INSPECT"
          echo "======================================"

          docker image inspect "$IMAGE"


          # ------------------------------------------------------
          # PUBLIC DIRECTORY
          # ------------------------------------------------------

          echo "======================================"
          echo "PUBLIC DIRECTORY"
          echo "======================================"

          docker run --rm "$IMAGE" \
            sh -c 'ls -la /var/www/html/public'


          # ------------------------------------------------------
          # INDEX.PHP
          # ------------------------------------------------------

          echo "======================================"
          echo "INDEX.PHP"
          echo "======================================"

          docker run --rm "$IMAGE" \
            sh -c 'test -f /var/www/html/public/index.php'


          # ------------------------------------------------------
          # VITE BUILD
          # ------------------------------------------------------

          echo "======================================"
          echo "VITE BUILD"
          echo "======================================"

          docker run --rm "$IMAGE" \
            sh -c '
              if [ -d /var/www/html/public/build ]; then
                echo "Vite build directory: PRESENT"

                find /var/www/html/public/build \
                  -maxdepth 2 \
                  -type f \
                  -print
              else
                echo "Vite build directory: MISSING"
                exit 1
              fi
            '


          # ------------------------------------------------------
          # VITE MANIFEST
          # ------------------------------------------------------

          echo "======================================"
          echo "VITE MANIFEST"
          echo "======================================"

          docker run --rm "$IMAGE" \
            sh -c '
              if [ -f /var/www/html/public/build/manifest.json ]; then
                echo "Vite manifest: PRESENT"
              else
                echo "Vite manifest: MISSING"
                exit 1
              fi
            '


          # ------------------------------------------------------
          # VITE MANIFEST CONTENT
          # ------------------------------------------------------

          echo "======================================"
          echo "VITE MANIFEST CONTENT"
          echo "======================================"

          docker run --rm "$IMAGE" \
            sh -c 'cat /var/www/html/public/build/manifest.json'


          # ------------------------------------------------------
          # PHP-FPM ENVIRONMENT CONFIG
          # ------------------------------------------------------

          echo "======================================"
          echo "PHP-FPM ENVIRONMENT CONFIG"
          echo "======================================"

          docker run --rm "$IMAGE" \
            sh -c '
              if [ -f /usr/local/etc/php-fpm.d/99-environment.conf ]; then
                echo "--- 99-environment.conf ---"
                cat /usr/local/etc/php-fpm.d/99-environment.conf
              else
                echo "99-environment.conf not present"
              fi
            '


          # ------------------------------------------------------
          # PHP-FPM CLEAR_ENV
          # ------------------------------------------------------

          echo "======================================"
          echo "PHP-FPM CLEAR_ENV"
          echo "======================================"

          docker run --rm "$IMAGE" \
            sh -c '
              grep -R "clear_env" \
                /usr/local/etc/php-fpm.d/ \
                || true
            '


          # ------------------------------------------------------
          # ENTRYPOINT
          # ------------------------------------------------------

          echo "======================================"
          echo "ENTRYPOINT"
          echo "======================================"

          docker run --rm "$IMAGE" \
            sh -c 'cat /usr/local/bin/entrypoint.sh'


          # ------------------------------------------------------
          # NGINX CONFIG
          # ------------------------------------------------------

          echo "======================================"
          echo "NGINX CONFIGURATION"
          echo "======================================"

          docker run --rm "$IMAGE" nginx -T


      # ==========================================================
      # TEST DOCKER CONTAINER
      # ==========================================================

      - name: Test Docker container
        shell: bash
        run: |
          set -euo pipefail

          CONTAINER_NAME="laravel-test"
          HOST_PORT="8080"

          # ------------------------------------------------------
          # ALWAYS CLEAN UP
          # ------------------------------------------------------

          cleanup() {
            echo
            echo "======================================"
            echo "CLEANUP TEST CONTAINER"
            echo "======================================"

            docker logs "$CONTAINER_NAME" 2>/dev/null || true

            docker stop "$CONTAINER_NAME" 2>/dev/null || true
            docker rm "$CONTAINER_NAME" 2>/dev/null || true
          }

          trap cleanup EXIT


          # ------------------------------------------------------
          # START CONTAINER
          # ------------------------------------------------------

          echo "======================================"
          echo "START CONTAINER"
          echo "======================================"

          docker run -d \
            --name "$CONTAINER_NAME" \
            -p "${HOST_PORT}:80" \
            -e APP_ENV=production \
            -e APP_DEBUG=false \
            -e APP_KEY="${{ secrets.APP_KEY }}" \
            "$IMAGE"


          # ------------------------------------------------------
          # WAIT FOR CONTAINER
          # ------------------------------------------------------

          echo "======================================"
          echo "WAITING FOR CONTAINER"
          echo "======================================"

          MAX_ATTEMPTS=30
          ATTEMPT=1

          until curl \
            --silent \
            --show-error \
            --fail \
            "http://localhost:${HOST_PORT}/" \
            > /dev/null
          do
            if [ "$ATTEMPT" -ge "$MAX_ATTEMPTS" ]; then
              echo "Application did not become ready."

              echo
              echo "Container status:"
              docker ps -a

              echo
              echo "Container logs:"
              docker logs "$CONTAINER_NAME" || true

              exit 1
            fi

            echo "Waiting for application... attempt ${ATTEMPT}/${MAX_ATTEMPTS}"

            sleep 2

            ATTEMPT=$((ATTEMPT + 1))
          done

          echo "Application is responding."


          # ------------------------------------------------------
          # DOCKER PS
          # ------------------------------------------------------

          echo "======================================"
          echo "DOCKER PS"
          echo "======================================"

          docker ps -a


          # ------------------------------------------------------
          # CONTAINER LOGS
          # ------------------------------------------------------

          echo "======================================"
          echo "CONTAINER LOGS"
          echo "======================================"

          docker logs "$CONTAINER_NAME"


          # ------------------------------------------------------
          # APP KEY
          # ------------------------------------------------------

          echo "======================================"
          echo "APP KEY ENVIRONMENT"
          echo "======================================"

          docker exec "$CONTAINER_NAME" \
            sh -c '
              if [ -n "$APP_KEY" ]; then
                echo "APP_KEY: PRESENT"
                echo "APP_KEY length: ${#APP_KEY}"
              else
                echo "APP_KEY: MISSING"
                exit 1
              fi
            '


          # ------------------------------------------------------
          # PHP APP KEY
          # ------------------------------------------------------

          echo "======================================"
          echo "PHP CAN READ APP_KEY"
          echo "======================================"

          docker exec "$CONTAINER_NAME" \
            php -r '
              $key = getenv("APP_KEY");

              if (!$key) {
                  echo "PHP APP_KEY: MISSING\n";
                  exit(1);
              }

              echo "PHP APP_KEY: PRESENT\n";
              echo "PHP APP_KEY length: " . strlen($key) . "\n";
            '


          # ------------------------------------------------------
          # PHP-FPM CLEAR_ENV
          # ------------------------------------------------------

          echo "======================================"
          echo "PHP-FPM CLEAR_ENV"
          echo "======================================"

          docker exec "$CONTAINER_NAME" \
            sh -c '
              php-fpm -i | grep -i "clear_env" || true
            '


          # ------------------------------------------------------
          # VITE BUILD
          # ------------------------------------------------------

          echo "======================================"
          echo "VITE BUILD INSIDE CONTAINER"
          echo "======================================"

          docker exec "$CONTAINER_NAME" \
            sh -c '
              test -d /var/www/html/public/build

              find /var/www/html/public/build \
                -maxdepth 2 \
                -type f \
                -print
            '


          # ------------------------------------------------------
          # VITE MANIFEST
          # ------------------------------------------------------

          echo "======================================"
          echo "VITE MANIFEST"
          echo "======================================"

          docker exec "$CONTAINER_NAME" \
            sh -c '
              test -f /var/www/html/public/build/manifest.json
            '

          echo "Vite manifest exists."


          # ------------------------------------------------------
          # LARAVEL ABOUT
          # ------------------------------------------------------

          echo "======================================"
          echo "LARAVEL ABOUT"
          echo "======================================"

          docker exec "$CONTAINER_NAME" \
            php artisan about


          # ------------------------------------------------------
          # LARAVEL APP CONFIG
          # ------------------------------------------------------

          echo "======================================"
          echo "LARAVEL APP CONFIG"
          echo "======================================"

          docker exec "$CONTAINER_NAME" \
            php artisan config:show app


          # ------------------------------------------------------
          # NGINX TEST
          # ------------------------------------------------------

          echo "======================================"
          echo "NGINX TEST"
          echo "======================================"

          curl \
            --fail-with-body \
            --show-error \
            --silent \
            "http://localhost:${HOST_PORT}/nginx-test"


          # ------------------------------------------------------
          # HOME PAGE
          # ------------------------------------------------------

          echo "======================================"
          echo "HOME PAGE"
          echo "======================================"

          curl \
            --fail-with-body \
            --show-error \
            --silent \
            "http://localhost:${HOST_PORT}/"


          # ------------------------------------------------------
          # LOGIN PAGE
          # ------------------------------------------------------

          echo "======================================"
          echo "LOGIN PAGE"
          echo "======================================"

          curl \
            --fail-with-body \
            --show-error \
            --silent \
            "http://localhost:${HOST_PORT}/login" \
            -o /tmp/login.html

          echo "Login page saved to /tmp/login.html"


          # ------------------------------------------------------
          # CHECK VITE REFERENCES
          # ------------------------------------------------------

          echo "======================================"
          echo "VITE REFERENCES IN LOGIN PAGE"
          echo "======================================"

          grep -Eo \
            '/build/[^"]+\.(js|css)' \
            /tmp/login.html \
            || true


          # ------------------------------------------------------
          # CHECK LOCALHOST VITE REFERENCES
          # ------------------------------------------------------

          echo "======================================"
          echo "CHECK FOR VITE DEV SERVER"
          echo "======================================"

          if grep -q "localhost:5173" /tmp/login.html; then
            echo "ERROR: Production page references Vite dev server."
            exit 1
          fi

          echo "No localhost:5173 reference found."


          # ------------------------------------------------------
          # PUBLIC DIRECTORY
          # ------------------------------------------------------

          echo "======================================"
          echo "PUBLIC DIRECTORY"
          echo "======================================"

          docker exec "$CONTAINER_NAME" \
            sh -c 'ls -la /var/www/html/public'


          # ------------------------------------------------------
          # INDEX PHP
          # ------------------------------------------------------

          echo "======================================"
          echo "INDEX.PHP"
          echo "======================================"

          docker exec "$CONTAINER_NAME" \
            sh -c 'test -f /var/www/html/public/index.php'


          # ------------------------------------------------------
          # LARAVEL LOG
          # ------------------------------------------------------

          echo "======================================"
          echo "LARAVEL LOG"
          echo "======================================"

          docker exec "$CONTAINER_NAME" \
            sh -c '
              if [ -d /var/www/html/storage/logs ]; then

                find /var/www/html/storage/logs \
                  -maxdepth 1 \
                  -type f \
                  -print \
                  -exec tail -100 {} \;

              fi
            ' || true


          # ------------------------------------------------------
          # PHP-FPM PROCESSES
          # ------------------------------------------------------

          echo "======================================"
          echo "PHP-FPM PROCESSES"
          echo "======================================"

          docker exec "$CONTAINER_NAME" \
            sh -c '
              ps aux | grep php-fpm || true
            '


          # ------------------------------------------------------
          # NGINX PROCESSES
          # ------------------------------------------------------

          echo "======================================"
          echo "NGINX PROCESSES"
          echo "======================================"

          docker exec "$CONTAINER_NAME" \
            sh -c '
              ps aux | grep nginx || true
            '


      # ==========================================================
      # PUSH IMAGE TO ECR
      # ==========================================================

      - name: Push Docker image
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "PUSHING IMAGE"
          echo "======================================"

          docker push "$IMAGE"


      # ==========================================================
      # VERIFY ECR IMAGE
      # ==========================================================

      - name: Verify ECR image
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "VERIFY ECR IMAGE"
          echo "======================================"

          aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" \
            --region "$AWS_REGION" \
            --no-cli-pager


      # ==========================================================
      # CREATE DOCKERRUN
      # ==========================================================

      - name: Create Dockerrun.aws.json
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "DOCKER IMAGE"
          echo "======================================"

          echo "$IMAGE"


          cat > Dockerrun.aws.json <<EOF
          {
            "AWSEBDockerrunVersion": "1",
            "Image": {
              "Name": "$IMAGE",
              "Update": "true"
            },
            "Ports": [
              {
                "ContainerPort": "80"
              }
            ]
          }
          EOF


          echo "======================================"
          echo "DOCKERRUN.AWS.JSON"
          echo "======================================"

          cat Dockerrun.aws.json


      # ==========================================================
      # VALIDATE DOCKERRUN
      # ==========================================================

      - name: Validate Dockerrun
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "VALIDATING DOCKERRUN"
          echo "======================================"

          python -m json.tool Dockerrun.aws.json


      # ==========================================================
      # CREATE DEPLOYMENT PACKAGE
      # ==========================================================

      - name: Create deployment package
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "CREATING DEPLOYMENT PACKAGE"
          echo "======================================"

          rm -f deployment.zip

          zip -q deployment.zip Dockerrun.aws.json


          echo "======================================"
          echo "DEPLOYMENT ZIP"
          echo "======================================"

          unzip -l deployment.zip


      # ==========================================================
      # UPLOAD TO S3
      # ==========================================================

      - name: Upload deployment package to S3
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "UPLOAD TO S3"
          echo "======================================"

          aws s3 cp \
            deployment.zip \
            "s3://${EB_S3_BUCKET}/deployments/${IMAGE_TAG}.zip" \
            --no-cli-pager


          echo "======================================"
          echo "S3 LOCATION"
          echo "======================================"

          echo "s3://${EB_S3_BUCKET}/deployments/${IMAGE_TAG}.zip"


      # ==========================================================
      # VERIFY S3 PACKAGE
      # ==========================================================

      - name: Verify S3 package
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "VERIFY S3 PACKAGE"
          echo "======================================"

          aws s3api head-object \
            --bucket "$EB_S3_BUCKET" \
            --key "deployments/${IMAGE_TAG}.zip" \
            --no-cli-pager


      # ==========================================================
      # CREATE EB APPLICATION VERSION
      # ==========================================================

      - name: Create Elastic Beanstalk application version
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "CREATE EB APPLICATION VERSION"
          echo "======================================"

          aws elasticbeanstalk create-application-version \
            --application-name "$EB_APPLICATION" \
            --version-label "$IMAGE_TAG" \
            --source-bundle \
              "S3Bucket=${EB_S3_BUCKET},S3Key=deployments/${IMAGE_TAG}.zip" \
            --process \
            --no-cli-pager


      # ==========================================================
      # DEPLOY TO ELASTIC BEANSTALK
      # ==========================================================

      - name: Deploy to Elastic Beanstalk
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "DEPLOY TO ELASTIC BEANSTALK"
          echo "======================================"

          aws elasticbeanstalk update-environment \
            --application-name "$EB_APPLICATION" \
            --environment-name "$EB_ENVIRONMENT" \
            --version-label "$IMAGE_TAG" \
            --no-cli-pager


      # ==========================================================
      # WAIT FOR DEPLOYMENT
      # ==========================================================

      - name: Wait for Elastic Beanstalk deployment
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "WAITING FOR ELASTIC BEANSTALK"
          echo "======================================"

          aws elasticbeanstalk wait environment-updated \
            --environment-name "$EB_ENVIRONMENT" \
            --no-cli-pager


      # ==========================================================
      # VERIFY EB
      # ==========================================================

      - name: Verify Elastic Beanstalk deployment
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "ELASTIC BEANSTALK STATUS"
          echo "======================================"

          aws elasticbeanstalk describe-environments \
            --application-name "$EB_APPLICATION" \
            --environment-names "$EB_ENVIRONMENT" \
            --query 'Environments[0].[EnvironmentName,VersionLabel,Status,Health,HealthStatus,CNAME]' \
            --output table \
            --no-cli-pager


          STATUS=$(aws elasticbeanstalk describe-environments \
            --application-name "$EB_APPLICATION" \
            --environment-names "$EB_ENVIRONMENT" \
            --query 'Environments[0].Status' \
            --output text \
            --no-cli-pager)

          HEALTH=$(aws elasticbeanstalk describe-environments \
            --application-name "$EB_APPLICATION" \
            --environment-names "$EB_ENVIRONMENT" \
            --query 'Environments[0].Health' \
            --output text \
            --no-cli-pager)

          HEALTH_STATUS=$(aws elasticbeanstalk describe-environments \
            --application-name "$EB_APPLICATION" \
            --environment-names "$EB_ENVIRONMENT" \
            --query 'Environments[0].HealthStatus' \
            --output text \
            --no-cli-pager)

          VERSION=$(aws elasticbeanstalk describe-environments \
            --application-name "$EB_APPLICATION" \
            --environment-names "$EB_ENVIRONMENT" \
            --query 'Environments[0].VersionLabel' \
            --output text \
            --no-cli-pager)


          echo
          echo "Status:        $STATUS"
          echo "Health:        $HEALTH"
          echo "Health status: $HEALTH_STATUS"
          echo "Version:       $VERSION"


          if [ "$STATUS" != "Ready" ]; then
            echo
            echo "ERROR: Elastic Beanstalk environment is not Ready."
            exit 1
          fi


          if [ "$VERSION" != "$IMAGE_TAG" ]; then
            echo
            echo "ERROR: Elastic Beanstalk is running an unexpected version."
            echo "Expected: $IMAGE_TAG"
            echo "Actual:   $VERSION"
            exit 1
          fi


          case "$HEALTH" in
            Green|Yellow)
              echo
              echo "Elastic Beanstalk health: ACCEPTED ($HEALTH)"
              ;;
            *)
              echo
              echo "ERROR: Elastic Beanstalk health is $HEALTH"
              exit 1
              ;;
          esac


      # ==========================================================
      # SHOW EB EVENTS
      # ==========================================================

      - name: Show Elastic Beanstalk events
        if: always()
        shell: bash
        run: |
          set +e

          echo "======================================"
          echo "ELASTIC BEANSTALK EVENTS"
          echo "======================================"

          aws elasticbeanstalk describe-events \
            --environment-name "$EB_ENVIRONMENT" \
            --max-items 30 \
            --query 'Events[*].[EventDate,Severity,Status,Message]' \
            --output table \
            --no-cli-pager


      # ==========================================================
      # FINAL DEPLOYMENT SUMMARY
      # ==========================================================

      - name: Deployment summary
        shell: bash
        run: |
          set -euo pipefail

          CNAME=$(aws elasticbeanstalk describe-environments \
            --application-name "$EB_APPLICATION" \
            --environment-names "$EB_ENVIRONMENT" \
            --query 'Environments[0].CNAME' \
            --output text \
            --no-cli-pager)

          echo "======================================"
          echo "DEPLOYMENT SUCCESSFUL"
          echo "======================================"

          echo
          echo "Application:"
          echo "$EB_APPLICATION"

          echo
          echo "Environment:"
          echo "$EB_ENVIRONMENT"

          echo
          echo "Version:"
          echo "$IMAGE_TAG"

          echo
          echo "Docker image:"
          echo "$IMAGE"

          echo
          echo "Elastic Beanstalk CNAME:"
          echo "$CNAME"
