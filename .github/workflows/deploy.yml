name: Deploy Laravel to Elastic Beanstalk

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}

  ECR_REPOSITORY: lara-aws-tf-prod-laravel

  EB_APPLICATION_NAME: lara-aws-tf-prod
  EB_ENVIRONMENT_NAME: lara-aws-tf-prod-env

jobs:
  terraform:
    uses: ./.github/workflows/terraform.yml
    secrets: inherit

  deploy:
    runs-on: ubuntu-latest
    needs: terraform

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image
        run: |
          IMAGE_TAG="${GITHUB_SHA}"
          IMAGE="${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"

      - name: Build Docker image
        run: |
          docker build \
            --pull \
            --tag "$IMAGE" \
            .

      - name: Push Docker image
        run: |
          docker push "$IMAGE"

      - name: Create Elastic Beanstalk bundle
        run: |
          set -euo pipefail

          mkdir -p deploy

          sed "s|\${IMAGE}|${IMAGE}|g" \
            docker-compose.yml \
            > deploy/docker-compose.yml

          cp Dockerrun.aws.json deploy/

          docker compose \
            -f deploy/docker-compose.yml \
            config

          cd deploy
          zip -r ../eb-deploy.zip .
          cd ..

      - name: Upload bundle to S3
        run: |
          set -euo pipefail

          ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          S3_BUCKET="elasticbeanstalk-${AWS_REGION}-${ACCOUNT_ID}"
          VERSION_LABEL="laravel-${GITHUB_SHA}"

          aws s3 cp \
            eb-deploy.zip \
            "s3://${S3_BUCKET}/${EB_APPLICATION_NAME}/${VERSION_LABEL}.zip"

          echo "S3_BUCKET=${S3_BUCKET}" >> "$GITHUB_ENV"
          echo "VERSION_LABEL=${VERSION_LABEL}" >> "$GITHUB_ENV"

      - name: Create Elastic Beanstalk application version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name "$EB_APPLICATION_NAME" \
            --version-label "$VERSION_LABEL" \
            --source-bundle \
              S3Bucket="$S3_BUCKET",S3Key="${EB_APPLICATION_NAME}/${VERSION_LABEL}.zip"

      - name: Deploy to Elastic Beanstalk
        run: |
          aws elasticbeanstalk update-environment \
            --application-name "$EB_APPLICATION_NAME" \
            --environment-name "$EB_ENVIRONMENT_NAME" \
            --version-label "$VERSION_LABEL"

      - name: Wait for deployment
        run: |
          aws elasticbeanstalk wait environment-updated \
            --application-name "$EB_APPLICATION_NAME" \
            --environment-names "$EB_ENVIRONMENT_NAME"

      - name: Show deployment status
        run: |
          aws elasticbeanstalk describe-environments \
            --application-name "$EB_APPLICATION_NAME" \
            --environment-names "$EB_ENVIRONMENT_NAME" \
            --query 'Environments[0].[Status,Health,VersionLabel]' \
            --output table
