name: Deploy Laravel

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:

  # ============================================================
  # TERRAFORM
  # ============================================================

  terraform:
    uses: ./.github/workflows/terraform.yml
    secrets: inherit


  # ============================================================
  # DEPLOY
  # ============================================================

  deploy:
    runs-on: ubuntu-latest
    needs: terraform

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}

      # ECR
      ECR_REPOSITORY: lara-aws-tf-prod-laravel

      # Elastic Beanstalk
      EB_APPLICATION: lara-aws-tf-prod
      EB_ENVIRONMENT: lara-aws-tf-prod-env

      # S3
      EB_S3_BUCKET: lara-aws-tf-prod

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================================
      # AWS CREDENTIALS
      # ==========================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}


      # ==========================================================
      # VERIFY AWS
      # ==========================================================

      - name: Verify AWS identity
        run: |
          echo "======================================"
          echo "AWS IDENTITY"
          echo "======================================"

          aws sts get-caller-identity


      # ==========================================================
      # LOGIN TO ECR
      # ==========================================================

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # ==========================================================
      # IMAGE TAG
      # ==========================================================

      - name: Set image tag
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA}" >> "$GITHUB_ENV"

          echo "======================================"
          echo "IMAGE TAG"
          echo "======================================"
          echo "$GITHUB_SHA"


      # ==========================================================
      # BUILD DOCKER IMAGE
      #
      # Vite is built INSIDE Docker.
      #
      # Node is only used in the frontend build stage.
      # Node does NOT need to run in production.
      # ==========================================================

      - name: Build Docker image
        run: |

          IMAGE="${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "======================================"
          echo "BUILDING DOCKER IMAGE"
          echo "======================================"

          echo "$IMAGE"

          docker build \
            --no-cache \
            --pull \
            -t "$IMAGE" \
            .


      # ==========================================================
      # INSPECT IMAGE
      # ==========================================================

      - name: Inspect Docker image
        run: |

          IMAGE="${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "======================================"
          echo "IMAGE"
          echo "======================================"

          echo "$IMAGE"


          # ------------------------------------------------------
          # PUBLIC DIRECTORY
          # ------------------------------------------------------

          echo "======================================"
          echo "PUBLIC DIRECTORY"
          echo "======================================"

          docker run --rm "$IMAGE" \
            sh -c 'ls -la /var/www/html/public'


          # ------------------------------------------------------
          # INDEX.PHP
          # ------------------------------------------------------

          echo "======================================"
          echo "INDEX.PHP"
          echo "======================================"

          docker run --rm "$IMAGE" \
            sh -c 'test -f /var/www/html/public/index.php'


          # ------------------------------------------------------
          # VITE BUILD
          # ------------------------------------------------------

          echo "======================================"
          echo "VITE BUILD"
          echo "======================================"

          docker run --rm "$IMAGE" \
            sh -c '
              if [ -d /var/www/html/public/build ]; then
                echo "Vite build directory: PRESENT"
                find /var/www/html/public/build \
                  -maxdepth 2 \
                  -type f \
                  -print
              else
                echo "Vite build directory: MISSING"
                exit 1
              fi
            '


          # ------------------------------------------------------
          # VITE MANIFEST
          # ------------------------------------------------------

          echo "======================================"
          echo "VITE MANIFEST"
          echo "======================================"

          docker run --rm "$IMAGE" \
            sh -c '
              if [ -f /var/www/html/public/build/manifest.json ]; then
                echo "Vite manifest: PRESENT"
              else
                echo "Vite manifest: MISSING"
                exit 1
              fi
            '


          # ------------------------------------------------------
          # VITE MANIFEST CONTENT
          # ------------------------------------------------------

          echo "======================================"
          echo "VITE MANIFEST CONTENT"
          echo "======================================"

          docker run --rm "$IMAGE" \
            sh -c 'cat /var/www/html/public/build/manifest.json'


          # ------------------------------------------------------
          # PHP-FPM ENVIRONMENT CONFIG
          # ------------------------------------------------------

          echo "======================================"
          echo "PHP-FPM ENVIRONMENT CONFIG"
          echo "======================================"

          docker run --rm "$IMAGE" \
            sh -c '
              echo "--- 99-environment.conf ---"
              cat /usr/local/etc/php-fpm.d/99-environment.conf
            '


          # ------------------------------------------------------
          # PHP-FPM CLEAR_ENV
          # ------------------------------------------------------

          echo "======================================"
          echo "PHP-FPM CLEAR_ENV"
          echo "======================================"

          docker run --rm "$IMAGE" \
            sh -c '
              grep -R "clear_env" \
                /usr/local/etc/php-fpm.d/ \
                || true
            '


          # ------------------------------------------------------
          # ENTRYPOINT
          # ------------------------------------------------------

          echo "======================================"
          echo "ENTRYPOINT"
          echo "======================================"

          docker run --rm "$IMAGE" \
            sh -c 'cat /usr/local/bin/entrypoint.sh'


          # ------------------------------------------------------
          # NGINX CONFIG
          # ------------------------------------------------------

          echo "======================================"
          echo "NGINX CONFIGURATION"
          echo "======================================"

          docker run --rm "$IMAGE" nginx -T


      # ==========================================================
      # TEST DOCKER CONTAINER
      # ==========================================================

      - name: Test Docker container
        run: |

          IMAGE="${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}:${IMAGE_TAG}"


          # ------------------------------------------------------
          # START CONTAINER
          # ------------------------------------------------------

          echo "======================================"
          echo "START CONTAINER"
          echo "======================================"

          docker run -d \
            --name laravel-test \
            -p 8080:80 \
            -e APP_ENV=production \
            -e APP_DEBUG=false \
            -e APP_KEY="${{ secrets.APP_KEY }}" \
            "$IMAGE"


          echo "Waiting for container..."

          sleep 10


          # ------------------------------------------------------
          # DOCKER PS
          # ------------------------------------------------------

          echo "======================================"
          echo "DOCKER PS"
          echo "======================================"

          docker ps -a


          # ------------------------------------------------------
          # CONTAINER LOGS
          # ------------------------------------------------------

          echo "======================================"
          echo "CONTAINER LOGS"
          echo "======================================"

          docker logs laravel-test || true


          # ------------------------------------------------------
          # APP KEY
          # ------------------------------------------------------

          echo "======================================"
          echo "APP KEY ENVIRONMENT"
          echo "======================================"

          docker exec laravel-test \
            sh -c '
              if [ -n "$APP_KEY" ]; then
                echo "APP_KEY: PRESENT"
                echo "APP_KEY length: ${#APP_KEY}"
              else
                echo "APP_KEY: MISSING"
                exit 1
              fi
            '


          # ------------------------------------------------------
          # PHP APP KEY
          # ------------------------------------------------------

          echo "======================================"
          echo "PHP CAN READ APP_KEY"
          echo "======================================"

          docker exec laravel-test \
            php -r '
              $key = getenv("APP_KEY");

              if (!$key) {
                  echo "PHP APP_KEY: MISSING\n";
                  exit(1);
              }

              echo "PHP APP_KEY: PRESENT\n";
              echo "PHP APP_KEY length: " . strlen($key) . "\n";
            '


          # ------------------------------------------------------
          # PHP-FPM CLEAR_ENV
          # ------------------------------------------------------

          echo "======================================"
          echo "PHP-FPM CLEAR_ENV"
          echo "======================================"

          docker exec laravel-test \
            sh -c '
              php-fpm -i | grep -i "clear_env" || true
            '


          # ------------------------------------------------------
          # VITE BUILD
          # ------------------------------------------------------

          echo "======================================"
          echo "VITE BUILD INSIDE CONTAINER"
          echo "======================================"

          docker exec laravel-test \
            sh -c '
              find /var/www/html/public/build \
                -maxdepth 2 \
                -type f \
                -print
            '


          # ------------------------------------------------------
          # VITE MANIFEST
          # ------------------------------------------------------

          echo "======================================"
          echo "VITE MANIFEST"
          echo "======================================"

          docker exec laravel-test \
            sh -c '
              test -f /var/www/html/public/build/manifest.json
            '

          echo "Vite manifest exists."


          # ------------------------------------------------------
          # LARAVEL ABOUT
          # ------------------------------------------------------

          echo "======================================"
          echo "LARAVEL ABOUT"
          echo "======================================"

          docker exec laravel-test \
            php artisan about \
            || true


          # ------------------------------------------------------
          # LARAVEL CONFIG
          # ------------------------------------------------------

          echo "======================================"
          echo "LARAVEL APP CONFIG"
          echo "======================================"

          docker exec laravel-test \
            php artisan config:show app \
            || true


          # ------------------------------------------------------
          # NGINX TEST
          # ------------------------------------------------------

          echo "======================================"
          echo "NGINX TEST"
          echo "======================================"

          curl -i \
            --fail-with-body \
            http://localhost:8080/nginx-test \
            || true


          # ------------------------------------------------------
          # HOME PAGE
          # ------------------------------------------------------

          echo "======================================"
          echo "HOME PAGE"
          echo "======================================"

          curl -i \
            --fail-with-body \
            http://localhost:8080/ \
            || true


          # ------------------------------------------------------
          # LOGIN PAGE
          # ------------------------------------------------------

          echo "======================================"
          echo "LOGIN PAGE"
          echo "======================================"

          curl -s \
            http://localhost:8080/login \
            -o /tmp/login.html \
            || true

          echo "Login page saved to /tmp/login.html"


          # ------------------------------------------------------
          # CHECK VITE REFERENCES
          # ------------------------------------------------------

          echo "======================================"
          echo "VITE REFERENCES IN LOGIN PAGE"
          echo "======================================"

          grep -Eo \
            '/build/[^"]+\.(js|css)' \
            /tmp/login.html \
            || true


          # ------------------------------------------------------
          # CHECK LOCALHOST VITE REFERENCES
          # ------------------------------------------------------

          echo "======================================"
          echo "CHECK FOR VITE DEV SERVER"
          echo "======================================"

          if grep -q "localhost:5173" /tmp/login.html; then
            echo "ERROR: Production page references Vite dev server."
            exit 1
          fi

          echo "No localhost:5173 reference found."


          # ------------------------------------------------------
          # PUBLIC DIRECTORY
          # ------------------------------------------------------

          echo "======================================"
          echo "PUBLIC DIRECTORY"
          echo "======================================"

          docker exec laravel-test \
            sh -c 'ls -la /var/www/html/public'


          # ------------------------------------------------------
          # INDEX PHP
          # ------------------------------------------------------

          echo "======================================"
          echo "INDEX.PHP"
          echo "======================================"

          docker exec laravel-test \
            sh -c 'ls -la /var/www/html/public/index.php'


          # ------------------------------------------------------
          # LARAVEL LOG
          # ------------------------------------------------------

          echo "======================================"
          echo "LARAVEL LOG"
          echo "======================================"

          docker exec laravel-test \
            sh -c '
              if [ -d /var/www/html/storage/logs ]; then

                find /var/www/html/storage/logs \
                  -maxdepth 1 \
                  -type f \
                  -print \
                  -exec tail -100 {} \;

              fi
            ' || true


          # ------------------------------------------------------
          # PHP-FPM PROCESSES
          # ------------------------------------------------------

          echo "======================================"
          echo "PHP-FPM PROCESSES"
          echo "======================================"

          docker exec laravel-test \
            sh -c '
              ps aux | grep php-fpm || true
            '


          # ------------------------------------------------------
          # NGINX PROCESSES
          # ------------------------------------------------------

          echo "======================================"
          echo "NGINX PROCESSES"
          echo "======================================"

          docker exec laravel-test \
            sh -c '
              ps aux | grep nginx || true
            '


          # ------------------------------------------------------
          # STOP TEST CONTAINER
          # ------------------------------------------------------

          echo "======================================"
          echo "STOP TEST CONTAINER"
          echo "======================================"

          docker stop laravel-test || true
          docker rm laravel-test || true


      # ==========================================================
      # PUSH IMAGE TO ECR
      # ==========================================================

      - name: Push Docker image
        run: |

          IMAGE="${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "======================================"
          echo "PUSHING IMAGE"
          echo "======================================"

          docker push "$IMAGE"


      # ==========================================================
      # VERIFY ECR IMAGE
      # ==========================================================

      - name: Verify ECR image
        run: |

          echo "======================================"
          echo "VERIFY ECR IMAGE"
          echo "======================================"

          aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" \
            --region "$AWS_REGION"


      # ==========================================================
      # CREATE DOCKERRUN
      # ==========================================================

      - name: Create Dockerrun.aws.json
        run: |

          IMAGE="${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "======================================"
          echo "DOCKER IMAGE"
          echo "======================================"

          echo "$IMAGE"


          cat > Dockerrun.aws.json <<EOF
          {
            "AWSEBDockerrunVersion": "1",
            "Image": {
              "Name": "$IMAGE",
              "Update": "true"
            },
            "Ports": [
              {
                "ContainerPort": "80"
              }
            ]
          }
          EOF


          echo "======================================"
          echo "DOCKERRUN.AWS.JSON"
          echo "======================================"

          cat Dockerrun.aws.json


      # ==========================================================
      # VALIDATE DOCKERRUN
      # ==========================================================

      - name: Validate Dockerrun
        run: |

          echo "======================================"
          echo "VALIDATING DOCKERRUN"
          echo "======================================"

          python -m json.tool Dockerrun.aws.json


      # ==========================================================
      # CREATE DEPLOYMENT PACKAGE
      # ==========================================================

      - name: Create deployment package
        run: |

          echo "======================================"
          echo "CREATING DEPLOYMENT PACKAGE"
          echo "======================================"

          rm -f deployment.zip

          zip -q deployment.zip Dockerrun.aws.json


          echo "======================================"
          echo "DEPLOYMENT ZIP"
          echo "======================================"

          unzip -l deployment.zip


      # ==========================================================
      # UPLOAD TO S3
      # ==========================================================

      - name: Upload deployment package to S3
        run: |

          echo "======================================"
          echo "UPLOAD TO S3"
          echo "======================================"

          aws s3 cp \
            deployment.zip \
            "s3://${EB_S3_BUCKET}/deployments/${IMAGE_TAG}.zip"


          echo "======================================"
          echo "S3 LOCATION"
          echo "======================================"

          echo "s3://${EB_S3_BUCKET}/deployments/${IMAGE_TAG}.zip"


      # ==========================================================
      # VERIFY S3 PACKAGE
      # ==========================================================

      - name: Verify S3 package
        run: |

          echo "======================================"
          echo "VERIFY S3 PACKAGE"
          echo "======================================"

          aws s3 ls \
            "s3://${EB_S3_BUCKET}/deployments/${IMAGE_TAG}.zip"


      # ==========================================================
      # CREATE EB APPLICATION VERSION
      # ==========================================================

      - name: Create Elastic Beanstalk application version
        run: |

          echo "======================================"
          echo "CREATE EB APPLICATION VERSION"
          echo "======================================"

          aws elasticbeanstalk create-application-version \
            --application-name "$EB_APPLICATION" \
            --version-label "$IMAGE_TAG" \
            --source-bundle \
              "S3Bucket=${EB_S3_BUCKET},S3Key=deployments/${IMAGE_TAG}.zip"


      # ==========================================================
      # DEPLOY TO ELASTIC BEANSTALK
      # ==========================================================

      - name: Deploy to Elastic Beanstalk
        run: |

          echo "======================================"
          echo "DEPLOY TO ELASTIC BEANSTALK"
          echo "======================================"

          aws elasticbeanstalk update-environment \
            --application-name "$EB_APPLICATION" \
            --environment-name "$EB_ENVIRONMENT" \
            --version-label "$IMAGE_TAG"


      # ==========================================================
      # WAIT FOR DEPLOYMENT
      # ==========================================================

      - name: Wait for Elastic Beanstalk deployment
        run: |

          echo "======================================"
          echo "WAITING FOR ELASTIC BEANSTALK"
          echo "======================================"

          aws elasticbeanstalk wait environment-updated \
            --environment-name "$EB_ENVIRONMENT"


      # ==========================================================
      # VERIFY EB
      # ==========================================================

      - name: Verify Elastic Beanstalk deployment
        run: |

          echo "======================================"
          echo "ELASTIC BEANSTALK STATUS"
          echo "======================================"

          aws elasticbeanstalk describe-environments \
            --application-name "$EB_APPLICATION" \
            --environment-names "$EB_ENVIRONMENT" \
            --query 'Environments[0].[EnvironmentName,VersionLabel,Status,Health,HealthStatus,CNAME]' \
            --output table


      # ==========================================================
      # SHOW EB EVENTS
      # ==========================================================

      - name: Show Elastic Beanstalk events
        if: always()
        run: |

          echo "======================================"
          echo "ELASTIC BEANSTALK EVENTS"
          echo "======================================"

          aws elasticbeanstalk describe-events \
            --environment-name "$EB_ENVIRONMENT" \
            --max-items 30 \
            --query 'Events[*].[EventDate,Severity,Status,Message]' \
            --output table
